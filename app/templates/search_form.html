{% extends 'base.html' %}{% block content %}<h1 class='text-3xl font-bold mb-7'>Create search</h1><form method='post' action='/searches' class='card grid gap-5 max-w-2xl'><label>Name<input name='name' required placeholder='Japan November 2026'></label><div class='grid grid-cols-2 gap-4'>
<div class='airport-field'><label for='origin_query'>From</label><input id='origin_query' type='text' autocomplete='off' data-airport-input='origin' oninput="document.getElementById('origin_code').value=''" placeholder='City, airport or code' value='{{origin_label|default("")}}' hx-get='/api/airports/search?field=origin' hx-trigger='keyup changed delay:200ms, focus' hx-target='#origin_dropdown' hx-swap='innerHTML'><input type='hidden' name='origin' id='origin_code' required value='{{origin_code|default("")}}'><div id='origin_dropdown'></div></div>
<div class='airport-field'><label for='destination_query'>To</label><input id='destination_query' type='text' autocomplete='off' data-airport-input='destination' oninput="document.getElementById('destination_code').value=''" placeholder='City, airport or code' value='{{destination_label|default("")}}' hx-get='/api/airports/search?field=destination' hx-trigger='keyup changed delay:200ms, focus' hx-target='#destination_dropdown' hx-swap='innerHTML'><input type='hidden' name='destination' id='destination_code' required value='{{destination_code|default("")}}'><div id='destination_dropdown'></div></div>
</div><div class='grid grid-cols-2 gap-4'><label>Earliest departure<input type='date' name='earliest_departure' required></label><label>Latest departure<input type='date' name='latest_departure' required></label></div><div class='grid grid-cols-2 gap-4'><label>Minimum trip days<input type='number' name='min_trip_days' min='1' value='13'></label><label>Maximum trip days<input type='number' name='max_trip_days' min='1' value='16'></label></div><div class='grid grid-cols-2 gap-4'><label>Latest return<input type='date' name='latest_return' required></label><label>Target price<input type='number' name='target_price' min='0' value='3500'></label></div><div class='grid grid-cols-2 gap-4'><label>Currency<input name='currency' value='PLN' maxlength='3'></label><label>Maximum stops<input type='number' name='max_stops' min='0' value='1'></label></div><label>Schedule<select name='schedule'><option value='manual'>Manual only</option><option value='daily'>Daily at 08:00</option></select></label><p class='text-sm text-slate-500'>Searches use the local open-source fli adapter for Google Flights. Requests are rate-limited. Discovered offers remain unverified until a reliable ticketing check is available.</p><button class='button w-full'>Create search and run</button></form>{% endblock %}
