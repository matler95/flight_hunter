{% extends 'base.html' %}{% block content %}<h1 class='text-3xl font-bold mb-7'>Create search</h1><form method='post' action='/searches' class='card grid gap-5 max-w-2xl'><label>Name<input name='name' required placeholder='Japan November 2026'></label><div class='grid grid-cols-2 gap-4'><label>From<input name='origin' required value='WAW' maxlength='3'></label><label>To<input name='destination' required value='TYO' maxlength='3'></label></div><div class='grid grid-cols-2 gap-4'><label>Earliest departure<input type='date' name='earliest_departure' required></label><label>Latest departure<input type='date' name='latest_departure' required></label></div><div class='grid grid-cols-2 gap-4'><label>Minimum trip days<input type='number' name='min_trip_days' min='1' value='13'></label><label>Maximum trip days<input type='number' name='max_trip_days' min='1' value='16'></label></div><div class='grid grid-cols-2 gap-4'><label>Latest return<input type='date' name='latest_return' required></label><label>Target price<input type='number' name='target_price' min='0' value='3500'></label></div><div class='grid grid-cols-2 gap-4'><label>Currency<input name='currency' value='PLN' maxlength='3'></label><label>Maximum stops<input type='number' name='max_stops' min='0' value='1'></label></div><p class='text-sm text-slate-500'>The included offline provider returns mock offers. Only confirmed single-ticket itineraries may trigger future alerts.</p><button class='button w-full'>Create search and run</button></form>{% endblock %}
