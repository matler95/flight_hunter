[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'flight-hunter'
version = '0.1.0'
description = 'Local flight search and price tracker'
requires-python = '>=3.12'
dependencies = ['fastapi>=0.115','uvicorn[standard]>=0.32','jinja2>=3.1','sqlalchemy>=2.0','alembic>=1.14','pydantic>=2.0','pydantic-settings>=2.6','httpx>=0.27','apscheduler>=3.10','python-multipart>=0.0.12']
[dependency-groups]
dev = ['pytest>=8.0','pytest-asyncio>=0.24','ruff>=0.8','mypy>=1.13']
[tool.pytest.ini_options]
pythonpath=['.']
testpaths=['tests']
[tool.ruff]
line-length=120
[tool.setuptools.packages.find]
include=['app*']

[tool.ruff.lint]

ignore = ['B008', 'BLE001', 'DTZ001', 'DTZ005', 'FURB157', 'RUF059', 'C408']
